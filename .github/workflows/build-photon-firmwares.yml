name: Build Photon Firmwares
run-name: Build Photon Firmwares (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      firmware_version:
        description: "Version used in artifact filenames, for example v1.17.0"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Resolve Firmware Version
        shell: bash
        env:
          FIRMWARE_VERSION_INPUT: ${{ inputs.firmware_version }}
        run: |
          if [ -n "${FIRMWARE_VERSION_INPUT}" ]; then
            version="${FIRMWARE_VERSION_INPUT}"
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="v1.17.0"
          fi

          echo "FIRMWARE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "Using firmware version: ${version}"

      - name: Build Photon Firmwares
        shell: bash
        env:
          FIRMWARE_VERSION: ${{ env.FIRMWARE_VERSION }}
        run: /usr/bin/env bash scripts/build-photon-firmwares.sh

      - name: Verify Firmware Checksums
        shell: bash
        run: cd out && sha256sum -c SHA256SUMS.txt

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: photon-firmwares-${{ env.FIRMWARE_VERSION }}
          path: out/*
          if-no-files-found: error
