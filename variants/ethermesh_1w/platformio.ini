[EtherMesh_1W]
extends = esp32_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-p4-evboard
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
  ${esp32_base.build_flags}
  -I variants/ethermesh_1w
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ETHERMESH_1W
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=33
  -D P_LORA_NSS=20
  -D P_LORA_RESET=26
  -D P_LORA_BUSY=32
  -D P_LORA_SCLK=21
  -D P_LORA_MISO=23
  -D P_LORA_MOSI=22
  -D P_LORA_RF_EN=27
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/ethermesh_1w>
lib_deps =
  ${esp32_base.lib_deps}

[env:EtherMesh_1W_companion_radio_ethernet]
extends = EtherMesh_1W
build_flags =
  ${EtherMesh_1W.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ETHERNET_COMPANION=1
  -D ETH_PHY_TYPE=ETH_PHY_IP101
  -D ETH_PHY_ADDR=1
  -D ETH_PHY_MDC=31
  -D ETH_PHY_MDIO=52
  -D ETH_PHY_RESET=51
  -D ETH_PHY_POWER=-1
  -D ETH_CLK_MODE=EMAC_CLK_EXT_IN
build_src_filter = ${EtherMesh_1W.build_src_filter}
  +<helpers/esp32/CompanionNetwork.cpp>
  +<helpers/esp32/SerialNetworkInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${EtherMesh_1W.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:EtherMesh_1W_repeater]
extends = EtherMesh_1W
build_flags =
  ${EtherMesh_1W.build_flags}
  -D ADVERT_NAME='"EtherMesh Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D OTA_OVER_ETHERNET=1
  -D ETH_PHY_TYPE=ETH_PHY_IP101
  -D ETH_PHY_ADDR=1
  -D ETH_PHY_MDC=31
  -D ETH_PHY_MDIO=52
  -D ETH_PHY_RESET=51
  -D ETH_PHY_POWER=-1
  -D ETH_CLK_MODE=EMAC_CLK_EXT_IN
build_src_filter = ${EtherMesh_1W.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${EtherMesh_1W.lib_deps}
  ${esp32_ota.lib_deps}
