; RAK10724 battery kit: RAK19007 + RAK3401 + RAK13302 (SX1262/SKY66122).
; Reuse the proven core, radio, ADC and shared-rail pin map.
[env:RAK_10724_repeater]
extends = env:RAK_3401_repeater
extra_scripts = ${nrf52_base.extra_scripts}
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak3401>
  +<helpers/sensors>
  +<../examples/simple_repeater>
build_flags = ${nrf52_base.build_flags}
  -I variants/rak3401
  -D RAK_3401
  -D RAK_BOARD
  -D RAK10724_TELEMETRY=1
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1
  -D FORCE_GPS_ALIVE
  -D PIN_GPS_EN=-1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_INA260=1
  -D TELEM_INA260_ADDRESS=0x40
  -D RAK10724_LOW_BATTERY_MV=3500
  -D ENABLE_BATTERY_INFO_ADVERT=1
  -D BATTERY_INFO_CHANNEL_SECRET_HEX='"1cbfc5bff8423774fbf3f5c8db09c60d"'
  -D ADVERT_NAME='"RAK10724 Repeater"'
  -D FIRMWARE_VERSION='"v1.17.1-PS17.1.5-rak10724"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
lib_deps = ${nrf52_base.lib_deps}
  adafruit/Adafruit SHTC3 Library @ 1.0.1
  adafruit/Adafruit INA260 Library @ 1.5.3
